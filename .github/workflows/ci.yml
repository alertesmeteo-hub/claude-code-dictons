name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'https://dicton-du-jour.alertes-meteo.com'
          OVH_API_URL: 'https://example.invalid/dicton-api' # factice, le build ne fait pas d'appel réseau réel
          OVH_API_TOKEN: 'factice'
